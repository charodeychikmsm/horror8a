<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>8А - Мультиплеер</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{overflow:hidden;background:#000;color:#ccc;font-family:'Courier New',monospace}
canvas{display:block}

/* МЕНЮ И ЛОББИ */
#ui-layer{position:fixed;inset:0;background:#050000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
.hidden{display:none !important}
h1{color:#a33;font-size:48px;text-shadow:0 0 20px #f00;margin-bottom:30px;letter-spacing:5px}
.btn{background:#0a0000;color:#c44;border:2px solid #500;padding:15px 30px;font-size:18px;cursor:pointer;font-family:inherit;margin:10px;transition:0.2s;min-width:250px;text-align:center}
.btn:hover{background:#200;color:#f55;border-color:#a00;transform:scale(1.05)}
input[type="text"]{background:#111;border:2px solid #500;color:#fa0;padding:15px;font-size:24px;font-family:inherit;text-align:center;letter-spacing:5px;margin-bottom:20px;width:250px;outline:none}

/* ЛОББИ */
#lobby-screen{text-align:center}
#lobby-code{font-size:64px;color:#fa0;letter-spacing:10px;margin:20px 0;text-shadow:0 0 20px #a80}
#player-count{font-size:20px;color:#888;margin-bottom:30px}
.diff-btns{display:flex;gap:10px;margin-bottom:20px;justify-content:center}
.diff-btns .btn{min-width:100px;padding:10px}
.diff-btns .btn.active{background:#400;color:#f55;border-color:#f00}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:10}
#crosshair{position:fixed;top:50%;left:50%;width:4px;height:4px;background:rgba(255,255,255,0.7);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:20;display:none}
#minimap{position:absolute;top:20px;right:20px;width:150px;height:150px;border:2px solid #500;background:rgba(0,0,0,0.8)}
#vignette{position:absolute;inset:0;background:radial-gradient(circle, transparent 40%, rgba(0,0,0,0.9) 100%);pointer-events:none}
</style>
</head>
<body>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="ui-layer">
  <h1>8А</h1>
  
  <div id="main-menu">
    <button class="btn" id="btn-create">Создать лобби</button>
    <button class="btn" id="btn-join-menu">Присоединиться по коду</button>
  </div>

  <div id="join-menu" class="hidden" style="text-align:center">
    <input type="text" id="join-code" placeholder="КОД" maxlength="4">
    <button class="btn" id="btn-join">Войти</button>
    <button class="btn" onclick="showMainMenu()">Назад</button>
  </div>

  <div id="lobby-screen" class="hidden">
    <h2>Лобби</h2>
    <div id="lobby-code">0000</div>
    <div id="player-count">Игроков: 1</div>
    
    <div class="diff-btns">
      <button class="btn diff-btn active" data-diff="easy">Легко</button>
      <button class="btn diff-btn" data-diff="normal">Нормально</button>
      <button class="btn diff-btn" data-diff="hard">Сложно</button>
    </div>

    <button class="btn" id="btn-start" style="display:none">НАЧАТЬ ИГРУ</button>
    <div id="wait-msg" style="color:#888;margin-top:10px">Ждем хоста...</div>
  </div>
</div>

<!-- ИГРА -->
<canvas id="game"></canvas>
<div id="hud">
  <div id="vignette"></div>
  <canvas id="minimap" width="150" height="150"></canvas>
</div>
<div id="crosshair"></div>

<script>
// --- СЕТЕВАЯ ЧАСТЬ ---
let socket = io();
let currentLobby = null;
let isHost = false;
let otherPlayers = {};
let game = null;
let difficulty = 'normal';

const ui = {
  main: document.getElementById('main-menu'),
  join: document.getElementById('join-menu'),
  lobby: document.getElementById('lobby-screen'),
  layer: document.getElementById('ui-layer'),
  hud: document.getElementById('hud'),
  crosshair: document.getElementById('crosshair'),
  codeDisplay: document.getElementById('lobby-code'),
  pCount: document.getElementById('player-count'),
  btnStart: document.getElementById('btn-start'),
  waitMsg: document.getElementById('wait-msg')
};

function showMainMenu() {
  ui.main.classList.remove('hidden');
  ui.join.classList.add('hidden');
  ui.lobby.classList.add('hidden');
}

document.getElementById('btn-create').onclick = () => socket.emit('createLobby');
document.getElementById('btn-join-menu').onclick = () => { ui.main.classList.add('hidden'); ui.join.classList.remove('hidden'); };
document.getElementById('btn-join').onclick = () => {
  let code = document.getElementById('join-code').value;
  if(code.length === 4) socket.emit('joinLobby', code);
};

socket.on('lobbyCreated', (code) => {
  currentLobby = code; isHost = true;
  ui.main.classList.add('hidden'); ui.lobby.classList.remove('hidden');
  ui.codeDisplay.textContent = code;
  ui.btnStart.style.display = 'inline-block'; ui.waitMsg.style.display = 'none';
});

socket.on('lobbyJoined', (code) => {
  currentLobby = code; isHost = false;
  ui.join.classList.add('hidden'); ui.lobby.classList.remove('hidden');
  ui.codeDisplay.textContent = code;
  ui.btnStart.style.display = 'none'; ui.waitMsg.style.display = 'block';
});

socket.on('lobbyError', (msg) => alert(msg));
socket.on('updatePlayers', (count) => ui.pCount.textContent = 'Игроков: ' + count);

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.onclick = () => {
    if(!isHost) return;
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    socket.emit('changeDifficulty', btn.dataset.diff);
  };
});
socket.on('difficultyChanged', (diff) => {
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b.dataset.diff === diff));
});

document.getElementById('btn-start').onclick = () => socket.emit('startGame');

socket.on('gameStarted', (data) => {
  difficulty = data.difficulty;
  ui.layer.classList.add('hidden');
  ui.hud.style.display = 'block';
  ui.crosshair.style.display = 'block';
  
  // Спавн ровно в центре перекрестка (x: 10.5, y: 10.5)
  game = {
    player: {x: 10.5, y: 10.5, angle: 0, pitch: 0},
    lastStep: 0
  };
  
  otherPlayers = {};
  for(let id in data.players) {
    if(id !== socket.id) otherPlayers[id] = data.players[id];
  }
  
  canvas.requestPointerLock();
  lastTime = performance.now();
  requestAnimationFrame(loop);
});

socket.on('playerMoved', (data) => {
  if(otherPlayers[data.id]) {
    otherPlayers[data.id].x = data.x;
    otherPlayers[data.id].y = data.y;
    otherPlayers[data.id].angle = data.angle;
    otherPlayers[data.id].isMoving = data.isMoving;
  }
});
socket.on('playerDisconnected', (id) => delete otherPlayers[id]);

// --- ЛОГИКА ИГРЫ ---
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
window.addEventListener('resize', resize); resize();

let keys = {};
let lastTime = 0;
let fov = 75;

// ПРОСТАЯ КАРТА (Крест), чтобы точно не застрять
function buildMap() {
  let g = Array.from({length: 20}, () => Array(20).fill('#'));
  // Горизонтальный коридор
  for(let i=1; i<19; i++) g[10][i] = '.';
  // Вертикальный коридор
  for(let i=1; i<19; i++) g[i][10] = '.';
  
  // Пара дверей (D) и окон (W)
  g[10][2] = 'D'; // Дверь слева
  g[10][17] = 'W'; // Окно справа
  g[2][10] = 'W'; // Окно сверху
  g[17][10] = 'D'; // Дверь снизу
  
  return g.map(row => row.join(''));
}
const MAP = buildMap();

function isWall(x, y) {
  let ix = Math.floor(x), iy = Math.floor(y);
  if(ix < 0 || iy < 0 || iy >= MAP.length || ix >= MAP[0].length) return true;
  return MAP[iy][ix] === '#';
}

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// ФИКС КАМЕРЫ
document.addEventListener('mousemove', e => {
  if(!game || document.pointerLockElement !== canvas) return;
  game.player.angle += e.movementX * 0.002;
  
  // Инверсия убрана, чувствительность понижена
  game.player.pitch -= e.movementY * 0.8; 
  
  // Ограничение взгляда вверх/вниз
  if (game.player.pitch > 200) game.player.pitch = 200;
  if (game.player.pitch < -200) game.player.pitch = -200;
});

function update(dt) {
  let p = game.player;
  let spd = (keys['ShiftLeft'] ? 4.5 : 2.5) * dt;
  let dx = 0, dy = 0;
  
  if(keys['KeyW'] || keys['ArrowUp']) { dx += Math.cos(p.angle); dy += Math.sin(p.angle); }
  if(keys['KeyS'] || keys['ArrowDown']) { dx -= Math.cos(p.angle); dy -= Math.sin(p.angle); }
  if(keys['KeyD'] || keys['ArrowRight']) { dx -= Math.sin(p.angle); dy += Math.cos(p.angle); }
  if(keys['KeyA'] || keys['ArrowLeft']) { dx += Math.sin(p.angle); dy -= Math.cos(p.angle); }
  
  let isMoving = false;
  let len = Math.hypot(dx, dy);
  if(len > 0) {
    isMoving = true;
    // Радиус коллизии уменьшен для плавности
    let nx = p.x + (dx/len)*spd, ny = p.y + (dy/len)*spd;
    if(!isWall(nx-0.15, ny-0.15) && !isWall(nx+0.15, ny-0.15) && !isWall(nx-0.15, ny+0.15) && !isWall(nx+0.15, ny+0.15)) {
      p.x = nx; p.y = ny;
    }
  }

  socket.emit('playerMovement', { x: p.x, y: p.y, angle: p.angle, pitch: p.pitch, isMoving });

  // Мини-карта
  let mm = document.getElementById('minimap').getContext('2d');
  mm.clearRect(0,0,150,150);
  mm.fillStyle = 'rgba(0,0,0,0.8)'; mm.fillRect(0,0,150,150);
  let cellSize = 150 / 20;
  for(let y=0; y<20; y++) {
    for(let x=0; x<20; x++) {
      if(MAP[y][x] === '#') { mm.fillStyle = '#333'; mm.fillRect(x*cellSize, y*cellSize, cellSize, cellSize); }
      if(MAP[y][x] === 'D') { mm.fillStyle = '#930'; mm.fillRect(x*cellSize, y*cellSize, cellSize, cellSize); }
      if(MAP[y][x] === 'W') { mm.fillStyle = '#39f'; mm.fillRect(x*cellSize, y*cellSize, cellSize, cellSize); }
    }
  }
  for(let id in otherPlayers) {
    let op = otherPlayers[id];
    mm.fillStyle = op.color || '#0f0';
    mm.beginPath(); mm.arc(op.x*cellSize, op.y*cellSize, 3, 0, Math.PI*2); mm.fill();
  }
  mm.fillStyle = '#fa0';
  mm.beginPath(); mm.arc(p.x*cellSize, p.y*cellSize, 3, 0, Math.PI*2); mm.fill();
}

// 3D МОДЕЛЬ ИГРОКА
function draw3DPlayer(scrX, scrY, size, color, isMoving, time) {
  ctx.save();
  ctx.translate(scrX, scrY);
  
  let walkPhase = isMoving ? Math.sin(time * 0.015) * 0.5 : 0;
  
  // Тень
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(0, size*0.4, size*0.15, size*0.05, 0, 0, Math.PI*2); ctx.fill();

  // Ноги
  ctx.fillStyle = '#111'; 
  ctx.fillRect(-size*0.08, size*0.1, size*0.06, size*0.3 + walkPhase*size*0.1);
  ctx.fillRect(size*0.02, size*0.1, size*0.06, size*0.3 - walkPhase*size*0.1);
  
  // Тело (куртка/рубашка)
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(-size*0.15, -size*0.15, size*0.3, size*0.3, size*0.05); ctx.fill();
  
  // Руки
  ctx.fillRect(-size*0.22, -size*0.1, size*0.05, size*0.25 + walkPhase*size*0.1);
  ctx.fillRect(size*0.17, -size*0.1, size*0.05, size*0.25 - walkPhase*size*0.1);

  // Голова
  ctx.fillStyle = '#fcd0ba';
  ctx.beginPath(); ctx.arc(0, -size*0.3, size*0.1, 0, Math.PI*2); ctx.fill();
  
  // Глаза (смотрят вправо)
  ctx.fillStyle = '#000';
  ctx.fillRect(-size*0.04, -size*0.32, size*0.02, size*0.02);
  ctx.fillRect(size*0.02, -size*0.32, size*0.02, size*0.02);
  
  ctx.restore();
}

function render() {
  let p = game.player;
  let horizon = H/2 + p.pitch; // Сдвиг горизонта
  
  // Небо и пол (двигаются при взгляде вверх/вниз)
  ctx.fillStyle = '#080808'; // Темный потолок
  ctx.fillRect(0, 0, W, Math.max(0, horizon));
  ctx.fillStyle = '#151515'; // Темный пол
  ctx.fillRect(0, Math.max(0, horizon), W, H);
  
  let zBuffer = new Float32Array(W);
  let fovRad = fov * Math.PI / 180;
  
  for(let i=0; i<W; i+=2) {
    let camX = 2 * i / W - 1;
    let rayAngle = p.angle + Math.atan(camX * Math.tan(fovRad / 2));
    let dx = Math.cos(rayAngle), dy = Math.sin(rayAngle);
    let mapX = Math.floor(p.x), mapY = Math.floor(p.y);
    let ddx = Math.abs(1/dx), ddy = Math.abs(1/dy);
    let stepX, stepY, sideDistX, sideDistY;
    if(dx < 0) { stepX = -1; sideDistX = (p.x - mapX) * ddx; } else { stepX = 1; sideDistX = (mapX + 1 - p.x) * ddx; }
    if(dy < 0) { stepY = -1; sideDistY = (p.y - mapY) * ddy; } else { stepY = 1; sideDistY = (mapY + 1 - p.y) * ddy; }
    
    let side = 0, perp = 0, hit = '#';
    for(let k=0; k<25; k++) {
      if(sideDistX < sideDistY) { perp = sideDistX; sideDistX += ddx; mapX += stepX; side = 0; }
      else { perp = sideDistY; sideDistY += ddy; mapY += stepY; side = 1; }
      if(mapY < 0 || mapX < 0 || mapY >= MAP.length || mapX >= MAP[0].length) { hit = '#'; break; }
      if(MAP[mapY][mapX] !== '.') { hit = MAP[mapY][mapX]; break; }
    }
    
    let dist = Math.max(0.001, perp);
    zBuffer[i] = dist; zBuffer[i+1] = dist;
    
    let bright = Math.min(1, (1 / (1 + dist * 0.15)));
    let wallH = (H * 1.2) / dist;
    let yTop = horizon - wallH/2;
    
    if(hit === '#') {
      // Текстура стены (кирпичи)
      let wallX = side === 0 ? p.y + dist * dy : p.x + dist * dx;
      let brick = Math.floor(wallX * 4) % 2 === 0;
      let base = side === 1 ? 50 : 70;
      if(brick) base -= 15;
      
      ctx.fillStyle = `rgb(${base*bright},${base*0.8*bright},${base*0.8*bright})`;
      ctx.fillRect(i, yTop, 2, wallH);
    } else if(hit === 'D') { // Дверь
      ctx.fillStyle = `rgb(${120*bright},${60*bright},${20*bright})`;
      ctx.fillRect(i, yTop, 2, wallH);
      // Ручка двери
      if(dist < 5 && Math.abs(camX) < 0.1) {
        ctx.fillStyle = `rgb(${200*bright},${180*bright},${0})`;
        ctx.fillRect(i, yTop + wallH/2, 2, wallH*0.05);
      }
    } else if(hit === 'W') { // Окно
      ctx.fillStyle = `rgba(80, 150, 255, ${bright})`;
      ctx.fillRect(i, yTop, 2, wallH);
      // Рамы
      ctx.fillStyle = '#000';
      ctx.fillRect(i, yTop + wallH/2, 2, wallH*0.05);
      ctx.fillRect(i, yTop, 2, wallH*0.05);
      ctx.fillRect(i, yTop + wallH - wallH*0.05, 2, wallH*0.05);
    }
  }
  
  // Рендер других игроков
  let time = performance.now();
  for(let id in otherPlayers) {
    let op = otherPlayers[id];
    let adx = op.x - p.x, ady = op.y - p.y, dist = Math.hypot(adx, ady);
    if(dist < 0.3) continue;
    let ang = Math.atan2(ady, adx) - p.angle;
    while(ang > Math.PI) ang -= Math.PI*2; while(ang < -Math.PI) ang += Math.PI*2;
    if(Math.abs(ang) > (fovRad/2 + 0.1)) continue;
    
    let scrX = W/2 + Math.tan(ang) * (W/2) / Math.tan(fovRad/2);
    let size = (H * 1.2) / dist;
    let cx = Math.floor(scrX);
    if(cx >= 0 && cx < W && zBuffer[cx] < dist) continue;
    
    draw3DPlayer(scrX, horizon + size*0.1, size, op.color || '#0f0', op.isMoving, time);
  }
}

function loop(t) {
  if(!game) return;
  let dt = Math.min(0.05, (t - lastTime) / 1000);
  lastTime = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
